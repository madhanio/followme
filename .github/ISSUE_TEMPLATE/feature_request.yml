name: 💡 Feature Request
description: Suggest an idea or enhancement for FollowMe
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love ideas from fellow builders and open source developers!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: What should happen or how should the UI/agent behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
